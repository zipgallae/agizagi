<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아기자기 감성 지도 - 내 주변 탐방</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fdfbf7;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #ffffff;
      border-right: 2px solid #f0eae1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.03);
    }

    .header-box {
      padding: 20px;
      background-color: #fffaf0;
      border-bottom: 2px dashed #f0eae1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #5a4033;
    }

    .location-input-group {
      display: flex;
      gap: 6px;
    }

    .location-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #e0d5c5;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .location-input:focus {
      border-color: #ffb84d;
    }

    .location-btn {
      padding: 10px 14px;
      background-color: #ffb84d;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .location-btn:hover {
      background-color: #ffa31a;
    }

    .tab-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .tab-button {
      flex: 1;
      padding: 10px 0;
      background-color: #f5efe6;
      color: #8c7a6b;
      border: 2px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tab-button:hover {
      background-color: #ebdcd0;
    }

    /* 카페 탭 활성화 시 갈색 스타일 */
    .tab-button.active.cafe {
      background-color: #8b4513;
      color: #ffffff;
      border-color: #6d330c;
      box-shadow: 0 3px 8px rgba(139, 69, 19, 0.3);
    }

    /* 소품샵 탭 활성화 시 주황색 스타일 */
    .tab-button.active.prop {
      background-color: #ff7f00;
      color: #ffffff;
      border-color: #e06c00;
      box-shadow: 0 3px 8px rgba(255, 127, 0, 0.3);
    }

    .results-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 12px;
    }

    .result-item {
      padding: 14px;
      margin-bottom: 10px;
      background-color: #fffdf9;
      border: 1px solid #f0eae1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .result-item:hover {
      background-color: #fff5e6;
      border-color: #ffd699;
      transform: translateY(-2px);
    }

    .place-title {
      font-size: 15px;
      font-weight: 700;
      color: #4a382c;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 12px;
      color: #806e62;
      line-height: 1.4;
    }

    .place-phone {
      font-size: 12px;
      color: #ff8c1a;
      margin-top: 4px;
      font-weight: 600;
    }

    .status-message {
      padding: 40px 20px;
      text-align: center;
      color: #a39284;
      font-size: 13px;
      line-height: 1.5;
    }

    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .custom-detail-card {
      width: 240px;
      padding: 12px;
      background: #ffffff;
      border-radius: 14px;
      border: 2px solid #ffb84d;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      font-family: 'Pretendard', sans-serif;
    }

    .card-image-box {
      width: 100%;
      height: 110px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
      background-color: #f5efe6;
    }

    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: bold;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .card-tag.cafe {
      background-color: #8b4513;
    }

    .card-tag.prop {
      background-color: #ff7f00;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #3d2b1f;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-address {
      font-size: 11px;
      color: #736256;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #eee;
      padding-top: 8px;
      font-size: 11px;
    }

    .card-link {
      color: #ff8c1a;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column-reverse;
      }

      .sidebar {
        width: 100%;
        height: 50%;
      }

      .map-container {
        height: 50%;
      }
    }
  </style>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7c77540131080fd98fb393c5bf4ca149&autoload=false&libraries=services"></script>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="header-box">
        <h1 class="service-title">☕ 감성 공간 탐방기</h1>
        
        <div class="location-input-group">
          <input type="text" id="centerLocationInput" class="location-input" placeholder="기준 위치 입력 (예: 강남역, 홍대입구)" onkeydown="if(event.key==='Enter') setCenterLocation()">
          <button class="location-btn" onclick="setCenterLocation()">위치 설정</button>
        </div>

        <div class="tab-group">
          <button id="tabCafe" class="tab-button active cafe" onclick="switchCategory('CE7')">☕ 카페</button>
          <button id="tabProp" class="tab-button" onclick="switchCategory('소품샵')">🧸 소품샵</button>
        </div>
      </div>
      
      <ul id="placesList" class="results-list">
        <li class="status-message">위치를 불러오는 중입니다...</li>
      </ul>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    const SAMPLE_CAFE_IMAGE = 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=400&q=80';
    const SAMPLE_PROP_IMAGE = 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=400&q=80';

    // SVG 형태의 커스텀 마커 이미지 데이터 생성 함수 (갈색 / 주황색)
    function createCustomMarkerImage(colorHex) {
      const svgMarker = `
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="42" viewBox="0 0 30 42">
          <path fill="${colorHex}" stroke="#ffffff" stroke-width="2" d="M15 0C6.716 0 0 6.716 0 15c0 10.5 15 27 15 27s15-16.5 15-27C30 6.716 23.284 0 15 0z"/>
          <circle cx="15" cy="14" r="5" fill="#ffffff"/>
        </svg>
      `;

      const imageUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarker);
      const imageSize = new kakao.maps.Size(30, 42);
      const imageOption = { offset: new kakao.maps.Point(15, 42) };

      return new kakao.maps.MarkerImage(imageUrl, imageSize, imageOption);
    }

    let mapObject = null;
    let placesService = null;
    let infoWindowObject = null;
    let markersArray = [];
    let currentCenterPosition = null;
    let currentCategory = 'CE7';

    kakao.maps.load(function() {
      initMap();
    });

    function initMap() {
      const container = document.getElementById('map');
      const defaultCenter = new kakao.maps.LatLng(37.566826, 126.9786567);
      
      const options = {
        center: defaultCenter,
        level: 5
      };

      mapObject = new kakao.maps.Map(container, options);
      placesService = new kakao.maps.services.Places();
      infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 1 });

      currentCenterPosition = defaultCenter;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentCenterPosition = new kakao.maps.LatLng(lat, lng);
            
            mapObject.setCenter(currentCenterPosition);
            document.getElementById('centerLocationInput').value = '현재 내 위치';
            searchPlacesByCategory(currentCategory);
          },
          function(error) {
            document.getElementById('centerLocationInput').value = '서울시청';
            searchPlacesByCategory(currentCategory);
          },
          { timeout: 3000 }
        );
      } else {
        document.getElementById('centerLocationInput').value = '서울시청';
        searchPlacesByCategory(currentCategory);
      }
    }

    function setCenterLocation() {
      const inputKeyword = document.getElementById('centerLocationInput').value.trim();

      if (!inputKeyword) return;

      placesService.keywordSearch(inputKeyword, function(data, status) {
        if (status === kakao.maps.services.Status.OK) {
          const firstResult = data[0];
          currentCenterPosition = new kakao.maps.LatLng(firstResult.y, firstResult.x);
          mapObject.setCenter(currentCenterPosition);
          searchPlacesByCategory(currentCategory);
        } else {
          document.getElementById('placesList').innerHTML = '<li class="status-message">해당 위치를 찾을 수 없습니다. 다른 위치를 검색해 보세요!</li>';
        }
      });
    }

    function switchCategory(category) {
      currentCategory = category;

      const btnCafe = document.getElementById('tabCafe');
      const btnProp = document.getElementById('tabProp');

      if (category === 'CE7') {
        btnCafe.className = 'tab-button active cafe';
        btnProp.className = 'tab-button';
      } else {
        btnCafe.className = 'tab-button';
        btnProp.className = 'tab-button active prop';
      }

      searchPlacesByCategory(category);
    }

    function searchPlacesByCategory(category) {
      clearMapAndList();

      const searchCenter = currentCenterPosition || mapObject.getCenter();

      if (category === 'CE7') {
        placesService.categorySearch('CE7', placesSearchCallback, {
          location: searchCenter,
          radius: 1500
        });
      } else {
        placesService.keywordSearch('소품샵', placesSearchCallback, {
          location: searchCenter,
          radius: 1500
        });
      }
    }

    function placesSearchCallback(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
      } else {
        const listElement = document.getElementById('placesList');
        listElement.innerHTML = '<li class="status-message">주변에 검색 결과가 없습니다. 위치를 다시 입력해 보세요!</li>';
      }
    }

    function displayPlaces(places) {
      const listElement = document.getElementById('placesList');
      const bounds = new kakao.maps.LatLngBounds();

      // 카테고리에 따라 색상 다르게 지정 (카페: 갈색 #8B4513, 소품샵: 주황색 #FF7F00)
      const markerColor = currentCategory === 'CE7' ? '#8B4513' : '#FF7F00';
      const markerImage = createCustomMarkerImage(markerColor);

      if (currentCenterPosition) {
        bounds.extend(currentCenterPosition);
      }

      places.forEach(function(place, index) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 색상이 지정된 커스텀 마커 이미지 적용
        const marker = new kakao.maps.Marker({
          position: placePosition,
          map: mapObject,
          image: markerImage
        });
        markersArray.push(marker);

        bounds.extend(placePosition);

        const listItem = document.createElement('li');
        listItem.className = 'result-item';
        const addressText = place.road_address_name || place.address_name;
        
        listItem.innerHTML = `
          <div class="place-title">${index + 1}. ${place.place_name}</div>
          <div class="place-address">${addressText}</div>
          ${place.phone ? `<div class="place-phone">📞 ${place.phone}</div>` : ''}
        `;

        kakao.maps.event.addListener(marker, 'click', function() {
          showDetailCardPopup(marker, place);
        });

        listItem.addEventListener('click', function() {
          mapObject.panTo(placePosition);
          showDetailCardPopup(marker, place);
        });

        listElement.appendChild(listItem);
      });

      mapObject.setBounds(bounds);
    }

    function showDetailCardPopup(marker, place) {
      const addressText = place.road_address_name || place.address_name;
      const isCafe = currentCategory === 'CE7';
      const categoryName = isCafe ? '카페' : '소품샵';
      const tagClass = isCafe ? 'cafe' : 'prop';
      const sampleImageUrl = isCafe ? SAMPLE_CAFE_IMAGE : SAMPLE_PROP_IMAGE;

      const popupHtml = `
        <div class="custom-detail-card">
          <div class="card-image-box">
            <img src="${sampleImageUrl}" alt="${place.place_name}">
          </div>
          <span class="card-tag ${tagClass}">✨ ${categoryName}</span>
          <div class="card-title" title="${place.place_name}">${place.place_name}</div>
          <div class="card-address">${addressText}</div>
          <div class="card-footer">
            <span>${place.phone || '전화번호 없음'}</span>
            <a href="${place.place_url}" target="_blank" class="card-link">상세보기 ➔</a>
          </div>
        </div>
      `;

      infoWindowObject.setContent(popupHtml);
      infoWindowObject.open(mapObject, marker);
    }

    function clearMapAndList() {
      markersArray.forEach(function(marker) {
        marker.setMap(null);
      });
      markersArray = [];

      const listElement = document.getElementById('placesList');
      listElement.innerHTML = '';

      if (infoWindowObject) {
        infoWindowObject.close();
      }
    }
  </script>
</body>
</html>
