<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아기자기 감성 지도 - 내 주변 탐방</title>
  
  <!-- CSS 스타일링 -->
  <style>
    /* 기본 리셋 및 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fdfbf7;
    }

    /* 화면 2분할 메인 레이아웃 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 사이드바 */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #ffffff;
      border-right: 2px solid #f0eae1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.03);
    }

    /* 헤더 및 컨트롤 영역 */
    .header-box {
      padding: 20px;
      background-color: #fffaf0;
      border-bottom: 2px dashed #f0eae1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #5a4033;
    }

    /* 기준 위치 입력 창 */
    .location-input-group {
      display: flex;
      gap: 6px;
    }

    .location-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #e0d5c5;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s;
    }

    .location-input:focus {
      border-color: #ffb84d;
    }

    .location-btn {
      padding: 10px 14px;
      background-color: #ffb84d;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .location-btn:hover {
      background-color: #ffa31a;
    }

    /* 탭 버튼 그룹 */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .tab-button {
      flex: 1;
      padding: 10px 0;
      background-color: #f5efe6;
      color: #8c7a6b;
      border: 2px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tab-button:hover {
      background-color: #ebdcd0;
    }

    .tab-button.active {
      background-color: #ffb84d;
      color: #ffffff;
      border-color: #ffa31a;
      box-shadow: 0 3px 8px rgba(255, 163, 26, 0.25);
    }

    /* 결과 리스트 영역 */
    .results-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 12px;
    }

    .result-item {
      padding: 14px;
      margin-bottom: 10px;
      background-color: #fffdf9;
      border: 1px solid #f0eae1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .result-item:hover {
      background-color: #fff5e6;
      border-color: #ffd699;
      transform: translateY(-2px);
    }

    .place-title {
      font-size: 15px;
      font-weight: 700;
      color: #4a382c;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 12px;
      color: #806e62;
      line-height: 1.4;
    }

    .place-phone {
      font-size: 12px;
      color: #ff8c1a;
      margin-top: 4px;
      font-weight: 600;
    }

    .status-message {
      padding: 40px 20px;
      text-align: center;
      color: #a39284;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 마커 클릭 시 나타나는 상세 팝업 스타일 */
    .custom-detail-card {
      width: 240px;
      padding: 12px;
      background: #ffffff;
      border-radius: 14px;
      border: 2px solid #ffb84d;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      font-family: 'Pretendard', sans-serif;
    }

    .card-image-box {
      width: 100%;
      height: 110px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
      background-color: #f5efe6;
    }

    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: bold;
      color: #ff8c1a;
      background-color: #fff0db;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #3d2b1f;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-address {
      font-size: 11px;
      color: #736256;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #eee;
      padding-top: 8px;
      font-size: 11px;
    }

    .card-link {
      color: #ff8c1a;
      text-decoration: none;
      font-weight: bold;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column-reverse;
      }

      .sidebar {
        width: 100%;
        height: 50%;
      }

      .map-container {
        height: 50%;
      }
    }
  </style>

  <!-- 카카오맵 JavaScript API 로드 -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7c77540131080fd98fb393c5bf4ca149&autoload=false&libraries=services"></script>
</head>
<body>

  <div class="app-container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <div class="header-box">
        <h1 class="service-title">☕ 감성 공간 탐방기</h1>
        
        <!-- 기준 위치 입력창 -->
        <div class="location-input-group">
          <input type="text" id="centerLocationInput" class="location-input" placeholder="기준 위치 입력 (예: 강남역, 홍대입구)" onkeydown="if(event.key==='Enter') setCenterLocation()">
          <button class="location-btn" onclick="setCenterLocation()">위치 설정</button>
        </div>

        <!-- 탭 버튼 -->
        <div class="tab-group">
          <button id="tabCafe" class="tab-button active" onclick="switchCategory('CE7')">☕ 카페</button>
          <button id="tabProp" class="tab-button" onclick="switchCategory('소품샵')">🧸 소품샵</button>
        </div>
      </div>
      
      <!-- 장소 목록 -->
      <ul id="placesList" class="results-list">
        <li class="status-message">기준 위치를 입력하거나 선택해 주세요.</li>
      </ul>
    </div>

    <!-- 오른쪽 지도 -->
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <!-- JavaScript 스크립트 -->
  <script>
    // 기본 더미 대표 이미지 URL (카페 및 소품샵용)
    const SAMPLE_CAFE_IMAGE = 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=400&q=80';
    const SAMPLE_PROP_IMAGE = 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=400&q=80';

    // 전역 변수
    let mapObject = null;
    let placesService = null;
    let infoWindowObject = null;
    let markersArray = [];
    let currentCenterPosition = null;
    let currentCategory = 'CE7'; // 기본값: 카페

    // 카카오맵 로드 후 초기화
    kakao.maps.load(function() {
      initMap();
    });

    /**
     * 지도 초기화 함수
     */
    function initMap() {
      const container = document.getElementById('map');
      
      // 초기 중심 위치 (기본값: 서울시청)
      const defaultCenter = new kakao.maps.LatLng(37.566826, 126.9786567);
      
      const options = {
        center: defaultCenter,
        level: 5
      };

      mapObject = new kakao.maps.Map(container, options);
      placesService = new kakao.maps.services.Places();
      infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 1 });

      currentCenterPosition = defaultCenter;

      // 사용자에게 현재 위치 기반으로 자동 설정할지 확인 (Geolocation)
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentCenterPosition = new kakao.maps.LatLng(lat, lng);
            mapObject.setCenter(currentCenterPosition);
            document.getElementById('centerLocationInput').value = '현재 내 위치';
            searchPlacesByCategory(currentCategory);
          },
          function(error) {
            // 위치 권한 거부 시 기본 주소 기준 탐색
            document.getElementById('centerLocationInput').value = '서울시청';
            searchPlacesByCategory(currentCategory);
          }
        );
      } else {
        document.getElementById('centerLocationInput').value = '서울시청';
        searchPlacesByCategory(currentCategory);
      }
    }

    /**
     * 입력된 위치 키워드로 기준 지도 중심 좌표 설정
     */
    function setCenterLocation() {
      const inputKeyword = document.getElementById('centerLocationInput').value.trim();

      if (!inputKeyword) {
        alert('기준 위치를 입력해 주세요!');
        return;
      }

      // 입력한 장소 키워드 검색
      placesService.keywordSearch(inputKeyword, function(data, status) {
        if (status === kakao.maps.services.Status.OK) {
          const firstResult = data[0];
          currentCenterPosition = new kakao.maps.LatLng(firstResult.y, firstResult.x);
          
          // 지도의 중심 이동
          mapObject.setCenter(currentCenterPosition);

          // 변경된 위치를 기준으로 현재 선택된 탭 검색 재실행
          searchPlacesByCategory(currentCategory);
        } else {
          alert('해당 위치를 찾을 수 없습니다. 다른 명칭으로 검색해 보세요.');
        }
      });
    }

    /**
     * 탭 버튼 변경 처리 함수
     */
    function switchCategory(category) {
      currentCategory = category;

      const btnCafe = document.getElementById('tabCafe');
      const btnProp = document.getElementById('tabProp');

      if (category === 'CE7') {
        btnCafe.classList.add('active');
        btnProp.classList.remove('active');
      } else {
        btnCafe.classList.remove('active');
        btnProp.classList.add('active');
      }

      searchPlacesByCategory(category);
    }

    /**
     * 설정된 위치 중심 및 반경 내 장소 검색
     */
    function searchPlacesByCategory(category) {
      clearMapAndList();

      const searchCenter = currentCenterPosition || mapObject.getCenter();

      if (category === 'CE7') {
        placesService.categorySearch('CE7', placesSearchCallback, {
          location: searchCenter,
          radius: 1500
        });
      } else {
        placesService.keywordSearch('소품샵', placesSearchCallback, {
          location: searchCenter,
          radius: 1500
        });
      }
    }

    /**
     * 장소 검색 결과 콜백
     */
    function placesSearchCallback(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        const listElement = document.getElementById('placesList');
        listElement.innerHTML = '<li class="status-message">입력한 위치 주변에 검색 결과가 없습니다.</li>';
      } else {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    /**
     * 리스트 및 마커 출력 처리
     */
    function displayPlaces(places) {
      const listElement = document.getElementById('placesList');
      const bounds = new kakao.maps.LatLngBounds();

      if (currentCenterPosition) {
        bounds.extend(currentCenterPosition);
      }

      places.forEach(function(place, index) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성
        const marker = new kakao.maps.Marker({
          position: placePosition,
          map: mapObject
        });
        markersArray.push(marker);

        bounds.extend(placePosition);

        // 리스트 아이템 생성
        const listItem = document.createElement('li');
        listItem.className = 'result-item';
        const addressText = place.road_address_name || place.address_name;
        
        listItem.innerHTML = `
          <div class="place-title">${index + 1}. ${place.place_name}</div>
          <div class="place-address">${addressText}</div>
          ${place.phone ? `<div class="place-phone">📞 ${place.phone}</div>` : ''}
        `;

        // 마커 클릭 시 상세 팝업 오픈
        kakao.maps.event.addListener(marker, 'click', function() {
          showDetailCardPopup(marker, place);
        });

        // 리스트 클릭 시 이동 및 팝업 오픈
        listItem.addEventListener('click', function() {
          mapObject.panTo(placePosition);
          showDetailCardPopup(marker, place);
        });

        listElement.appendChild(listItem);
      });

      mapObject.setBounds(bounds);
    }

    /**
     * 상세 카드 팝업 출력 함수 (이미지, 이름, 특징 등 포함)
     */
    function showDetailCardPopup(marker, place) {
      const addressText = place.road_address_name || place.address_name;
      const categoryName = currentCategory === 'CE7' ? '카페' : '소품샵';
      const sampleImageUrl = currentCategory === 'CE7' ? SAMPLE_CAFE_IMAGE : SAMPLE_PROP_IMAGE;

      // 상세 팝업 HTML 구조
      const popupHtml = `
        <div class="custom-detail-card">
          <div class="card-image-box">
            <img src="${sampleImageUrl}" alt="${place.place_name}">
          </div>
          <span class="card-tag">✨ ${categoryName}</span>
          <div class="card-title" title="${place.place_name}">${place.place_name}</div>
          <div class="card-address">${addressText}</div>
          <div class="card-footer">
            <span>${place.phone || '전화번호 미등록'}</span>
            <a href="${place.place_url}" target="_blank" class="card-link">상세보기 ➔</a>
          </div>
        </div>
      `;

      infoWindowObject.setContent(popupHtml);
      infoWindowObject.open(mapObject, marker);
    }

    /**
     * 지도 마커 및 리스트 초기화
     */
    function clearMapAndList() {
      markersArray.forEach(function(marker) {
        marker.setMap(null);
      });
      markersArray = [];

      const listElement = document.getElementById('placesList');
      listElement.innerHTML = '';

      if (infoWindowObject) {
        infoWindowObject.close();
      }
    }
  </script>
</body>
</html>
